# F-2(D-013 融合):并入根 workspace——独立 workspace 下 ffmpeg-sys-next 构建脚本
# 稳定栈溢出(根 workspace 同版本正常);D-008 的并行改 Cargo.toml 前提已随串行
# 开发消失。产物路径相应变为 <root>/target/release/(bat2/CI 同步)。
[package]
name = "rd-controller"
version = "0.4.6"
description = "rd window-level remote control - controller app"
edition = "2024"

[lib]
# `_lib` 后缀避免与 bin 名冲突（Windows，见 cargo#8519）
name = "rd_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
bytes = "1"
if-addrs = "0.13"
qoi = "0.4"
rd-crash = { path = "../../../crates/rd-crash" }
rd-proto = { path = "../../../crates/rd-proto" }
rd-security = { path = "../../../crates/rd-security" }
rd-touch-translate = { path = "../../../crates/rd-touch-translate" }
rd-transport = { path = "../../../crates/rd-transport" }
rd-switch = { path = "../../../crates/rd-switch" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
switchboard-core = { path = "../../../switchboard/sdk/rust/switchboard-core" }
switchboard-mod-fec-rs = { path = "../../../switchboard/sdk/rust/switchboard-mod-fec-rs" }
toml = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.7.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

# 桌面端专属能力（Windows / macOS / Linux）：托盘图标、自动更新、系统剪贴板、离线编码沙盒。
# 移动端（iOS / Android）自动跳过，避免链接桌面端专属原生库或 C++ 编码器（宪法 #4）。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
arboard = "3"
rd-encode = { path = "../../../crates/rd-encode" }
switchboard-mod-easytier = { path = "../../../switchboard/sdk/rust/switchboard-mod-easytier" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-updater = "2"

# Windows + macOS 融合版专属：内嵌被控核心（rd-agent），使 Mac 与 Windows 均同时支持「控制别人 + 被别人控制」。
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rd-agent = { path = "../../../apps/rd-agent" }

# macOS 专属：隐私权限实时检测（屏幕录制 / 辅助功能）。
[target.'cfg(target_os = "macos")'.dependencies]
rd-mac = { path = "../../../crates/rd-mac" }

# Windows 专属：托盘开机自启（winreg / Win32）。
[target.'cfg(windows)'.dependencies]
winreg = "0.10"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
