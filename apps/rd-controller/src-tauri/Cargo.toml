# F-2(D-013 融合):并入根 workspace——独立 workspace 下 ffmpeg-sys-next 构建脚本
# 稳定栈溢出(根 workspace 同版本正常);D-008 的并行改 Cargo.toml 前提已随串行
# 开发消失。产物路径相应变为 <root>/target/release/(bat2/CI 同步)。
[package]
name = "rd-controller"
version = "0.1.0"
description = "rd window-level remote control - controller app"
edition = "2024"

[lib]
# `_lib` 后缀避免与 bin 名冲突（Windows，见 cargo#8519）
name = "rd_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
bytes = "1"
if-addrs = "0.13"
qoi = "0.4"
rd-agent = { path = "../../../apps/rd-agent" }
rd-proto = { path = "../../../crates/rd-proto" }
rd-security = { path = "../../../crates/rd-security" }
rd-transport = { path = "../../../crates/rd-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2.7.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
winreg = "0.10"
zstd = "0.14"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
