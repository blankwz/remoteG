# 独立 workspace：不被根 workspace（已被根 Cargo.toml exclude）接管，target 隔离。
[workspace]

[package]
name = "rd-controller"
version = "0.1.0"
description = "rd window-level remote control - controller app"
edition = "2024"

[lib]
# `_lib` 后缀避免与 bin 名冲突（Windows，见 cargo#8519）
name = "rd_controller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
bytes = "1"
if-addrs = "0.13"
qoi = "0.4"
rd-proto = { path = "../../../crates/rd-proto" }
rd-security = { path = "../../../crates/rd-security" }
rd-transport = { path = "../../../crates/rd-transport" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
zstd = "0.14"

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
