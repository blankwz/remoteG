[package]
name = "rd-agent"
version.workspace = true
edition.workspace = true

[lib]
# 融合模式(D-013 F-1):agent 核心作为库被 rd-app(Tauri 壳)内嵌;
# bin 保留无头被控模式(服务/测试)。
name = "rd_agent"
path = "src/lib.rs"

[[bin]]
name = "rd-agent"
path = "src/main.rs"

[dependencies]
anyhow = { workspace = true }
clap = { version = "4", features = ["derive"] }
directories = "6"
if-addrs = "0.13"
igd = "0.12"
rd-capture-win = { path = "../../crates/rd-capture-win" }
rd-encode = { path = "../../crates/rd-encode" }
rd-input-win = { path = "../../crates/rd-input-win" }
rd-proto = { path = "../../crates/rd-proto" }
rd-crash = { path = "../../crates/rd-crash" }
rd-security = { path = "../../crates/rd-security" }
rd-term = { path = "../../crates/rd-term" }
rd-transport = { path = "../../crates/rd-transport" }
rd-switch = { path = "../../crates/rd-switch" }
switchboard-core = { path = "../../switchboard/sdk/rust/switchboard-core" }
switchboard-mod-fec-rs = { path = "../../switchboard/sdk/rust/switchboard-mod-fec-rs" }
switchboard-mod-easytier = { path = "../../switchboard/sdk/rust/switchboard-mod-easytier" }
rd-window-win = { path = "../../crates/rd-window-win" }
rd-vdisplay = { path = "../../crates/rd-vdisplay" }
rd-update-pack = { path = "../../crates/rd-update-pack" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-util = "0.7"
toml = "0.8"
tracing = { workspace = true }
tracing-appender = "0.2"
tracing-subscriber = { workspace = true, features = ["env-filter"] }

[dev-dependencies]
reed-solomon-erasure = "6"
tempfile = "3"

[target.'cfg(windows)'.dependencies]
crossbeam-channel = "0.5"
tray-icon = "0.21"
winreg = "0.10"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Security",
    "Win32_System_DataExchange",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_StationsAndDesktops",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
] }
