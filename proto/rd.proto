syntax = "proto3"; package rd.v0;

message Envelope { uint32 req_id = 1; oneof msg {
  Hello hello = 2; HelloAck hello_ack = 3;
  PairRequest pair_req = 4; PairResult pair_res = 5;
  ListWindows list_windows = 10; WindowList window_list = 11; WindowEvent window_event = 12;
  OpenWindow open_window = 13; OpenWindowAck open_window_ack = 14; CloseWindow close_window = 15;
  ViewportInfo viewport = 16; KeyEvent key = 20; MouseButton mouse_btn = 21; MouseWheel wheel = 22; TextInput text = 23;
  OpenTerminal open_term = 30; TerminalOpened term_opened = 31; TerminalResize term_resize = 32;
  StatsReport stats = 40; Error error = 99;
  // v0.1(D-013 包4;05_api §6):向后兼容追加——新 oneof tag、新字段
  ClipboardData clipboard = 41;
  SessionState session_state = 42;
  // v0.2(T-028 F5):画质档位(见 SetQuality)
  SetQuality set_quality = 43;
  // v0.2(T-028 F9):隐私屏(见 SetPrivacy;Pro 功能)
  SetPrivacy set_privacy = 44;
  // v0.2(T-031):文件传输(见 FileXferOffer)
  FileListReq file_list_req = 45; FileListAck file_list_ack = 46;
  FileXferOffer file_xfer_offer = 47; FileXferChunk file_xfer_chunk = 48;
  FileXferAck file_xfer_ack = 49; FileCancel file_cancel = 50; } }

// 画质档位(T-028 F5):控制端手动选择,覆盖码率自适应。
// window_id=0 表示会话内全部窗口;成功时 Agent 原样回 SetQuality(echo),
// 失败回 Error{code:60}。档位生效后 apply_rate 停用自适应,直到改回 AUTO。
enum QualityPreset {
  AUTO = 0;    // 智能自适应(默认,基线码控)
  HIGH = 1;    // 高清优先:最高 20Mbps / 60fps
  MEDIUM = 2;  // 均衡:8Mbps / 30fps
  LOW = 3;     // 流畅优先:2Mbps / 15fps(弱网救急)
}
message SetQuality { uint64 window_id = 1; QualityPreset preset = 2; }

// 隐私屏(T-028 F9):被控机屏幕整体黑屏(置顶黑罩,点击穿透),远控画面照常。
// window_id 预留(当前黑罩是机器级);成功时原样回 SetPrivacy(echo),
// 失败回 Error{code:60 参数错 / 70 非 Pro}。会话断开自动解除。
message SetPrivacy { uint64 window_id = 1; bool on = 2; }

message Hello { uint32 proto_ver = 1; string device_name = 2; repeated Codec decode_caps = 3; bool supports_444 = 4;
  // v0.2(T-027):控制端请求 fec-shards 视频路径（默认关，双端协商才生效）
  bool media_fec = 5; }
// v0.1: host_version(=5)被控端应用版本——控制端显眼处展示,防两端版本不一致排查困难。
message HelloAck { uint32 proto_ver = 1; string host_name = 2; repeated Codec encode_caps = 3; string host_version = 5;
  // v0.2(T-027):被控端确认 fec-shards 可用
  bool media_fec = 6;
  // v0.2(T-031):被控端物理网卡 MAC 列表(逗号分隔,大写冒号格式;唤醒 WOL 用;
  // 只含已启用非回环物理适配器,内容与局域网发现同级的公开信息)
  string mac_addrs = 7; }
message PairRequest { bytes spake2_msg = 1; }  message PairResult { bool ok = 1; bytes spake2_msg = 2; string reason = 3; }

message WindowInfo { uint64 id = 1; string title = 2; string process = 3; uint32 pid = 4; bytes icon_png = 5;
  int32 x = 6; int32 y = 7; uint32 w = 8; uint32 h = 9; uint32 dpi = 10; bool resizable = 11; bool minimized = 12; }
message ListWindows {}  message WindowList { repeated WindowInfo windows = 1; }
message WindowEvent { enum Kind { CREATED=0; DESTROYED=1; MOVED=2; TITLE=3; CHILD_ADDED=4; CHILD_REMOVED=5; } Kind kind = 1; WindowInfo info = 2; uint64 root_id = 3; }

enum FitMode { FIT = 0; SCALE = 1; NATIVE = 2; }
enum RenderLevel { L0_PIXEL = 0; L1_HYBRID = 1; L2_SEMANTIC = 2; }
// v0.1: view_only(=5)只看不控——Agent 对该窗口丢弃键鼠/文本注入(滚轮除外?
// 否:滚轮同弃,严格只读);控制端会话工具栏开关切换需 Close+Open 重开。
message OpenWindow { uint64 window_id = 1; FitMode fit = 2; RenderLevel max_level = 3; uint32 max_fps = 4; bool view_only = 5; }
message OpenWindowAck { uint64 window_id = 1; RenderLevel level = 2; uint32 video_stream_id = 3; uint32 tile_stream_id = 4; Codec codec = 5; uint32 w = 6; uint32 h = 7; }
message CloseWindow { uint64 window_id = 1; }
message ViewportInfo { uint64 window_id = 1; uint32 css_w = 2; uint32 css_h = 3; float dpr = 4; }

message KeyEvent { uint32 scancode = 1; bool extended = 2; bool down = 3; uint32 modifiers = 4; }
message MouseButton { uint64 window_id = 1; int32 x = 2; int32 y = 3; uint32 button = 4; bool down = 5; }
message MouseWheel { uint64 window_id = 1; int32 x = 2; int32 y = 3; int32 dx = 4; int32 dy = 5; }
message TextInput { string text = 1; }

message OpenTerminal { string shell = 1; uint32 cols = 2; uint32 rows = 3; string resume_id = 4; }
message TerminalOpened { string term_id = 1; uint32 stream_id = 2; }
message TerminalResize { string term_id = 1; uint32 cols = 2; uint32 rows = 3; }

enum Codec { H264_420 = 0; H264_444 = 1; HEVC_444 = 2; AV1 = 3; }
message StatsReport { uint32 fps = 1; uint32 rtt_ms = 2; uint32 kbps = 3; uint32 decode_ms = 4; }
message Error { uint32 code = 1; string message = 2; }

// ---------------------------------------------------------------------------
// v0.1(D-013 包4)
// ---------------------------------------------------------------------------

// 剪贴板同步(文本起步)。
// 控制端→Agent:write=true  写 Agent 本机剪贴板为 text;
//             write=false 请求 Agent 回读(Agent 回 write=false 帧携带当前文本)。
// Agent→控制端:write=false,text=Agent 剪贴板当前文本(回读应答或本机变化推送;
//             首版不含监听推送,变化推送列 v0.2 候选)。
message ClipboardData { bool write = 1; string text = 2; }

// 会话级状态通知(Agent→控制端,req_id=0):控制端据此区分「网络断/Agent 退出/
// 被端锁屏/共享暂停/本机有人使用」,替代只显示"已断开"的盲态。
message SessionState { enum Kind {
  CONNECTED = 0;    // 会话建立完成(信息性)
  AGENT_CLOSING = 1; // Agent 即将退出(托盘退出/系统关机),reason 说明
  PAUSED = 2;       // 共享已暂停(画面/输入/终端全停)
  RESUMED = 3;      // 共享已恢复
  LOCKED = 4;       // 被控端已锁屏(画面冻结属预期,解锁自动恢复)
  UNLOCKED = 5;     // 被控端已解锁
  HOST_BUSY = 6;    // 被控机本机有人正在使用(真实键鼠输入)——控制端注入被
                    // 挂起,光标显示禁止样式(向日葵式"本机优先",D-013 包5)
  HOST_IDLE = 7;    // 被控机本机空闲恢复——注入恢复
} Kind kind = 1; string reason = 2; }

// ---------------------------------------------------------------------------
// v0.2(T-031):文件传输
// ---------------------------------------------------------------------------
// 安全模型:与终端同级的会话能力(会话本就可任意读写文件),故不做路径白名单;
// 但每次传输落审计(audit.jsonl 只记名字/字节数/方向,不记内容),接收只允许
// 落到固定目录 Downloads\rd接收,文件名消毒防目录穿越。

// 目录条目。size 对目录无意义(恒 0)。
message FileEntry { string name = 1; bool dir = 2; uint64 size = 3; }
// 列目录:path 为绝对路径,空 = 被控端主目录;成功回 FileListAck(同 req_id),
// 失败回 Error{55}(文件类错误)。不跟随 ".." 之外的特殊语义,按原样列出。
message FileListReq { string path = 1; }
message FileListAck { repeated FileEntry entries = 1; string path = 2; }
// 传输握手:req_id=0,不走 RPC(后续分片也是 req_id=0,按 xfer_id 路由)。
// pull=false:控制端推送,name=纯文件名,被控端写 Downloads\rd接收\<消毒后 name>
//            (重名自动 " (n)" 去重);全部分片收齐后回 FileXferAck,校验失败立即回。
// pull=true :控制端请求远端文件,remote_path=被控端绝对路径;被控端顺序发
//            FileXferChunk(首片起 size 与实际不符按实际流式发),发完即止,
//            无 Ack;控制端写入失败时发 FileCancel 取消。
// xfer_id 由控制端分配(全局单调);size 仅作进度展示。
message FileXferOffer { uint64 xfer_id = 1; string name = 2; uint64 size = 3; bool pull = 4; string remote_path = 5; }
// 顺序分片(QUIC 可靠流保序):eof=true 为最后一片。64KiB 一片。
message FileXferChunk { uint64 xfer_id = 1; uint32 seq = 2; bytes data = 3; bool eof = 4; }
// 推送完成回执(被控端→控制端,req_id=0):ok=false 时 message 带大白话原因。
message FileXferAck { uint64 xfer_id = 1; bool ok = 2; string message = 3; }
// 取消(双向,req_id=0):接收方校验失败/写入失败/用户取消;发送方收到后停止分片。
message FileCancel { uint64 xfer_id = 1; string reason = 2; }
