name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-windows:
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg-btbn
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (libclang for ffmpeg-sys-next)
        run: choco install llvm -y
      - name: Download BtbN LGPL-shared FFmpeg 9.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/n9.0/ffmpeg-n9.0-win64-lgpl-shared.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Move-Item $dir.FullName "$env:GITHUB_WORKSPACE\ffmpeg-btbn"
      - name: Package agent
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-agent.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-agent-win64
          path: dist/rd-agent-*-win64.zip

  controller-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/rd-controller/pnpm-lock.yaml
      - name: Build controller (NSIS installer)
        shell: pwsh
        run: |
          pnpm -C apps/rd-controller install --frozen-lockfile
          pnpm -C apps/rd-controller tauri build
          # 未签名安装包；NSIS 产物在 src-tauri/target/release/bundle/nsis/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-controller-windows
          path: apps/rd-controller/src-tauri/target/release/bundle/nsis/*.exe

  controller-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/rd-controller/pnpm-lock.yaml
      - name: Build controller (dmg, unsigned)
        run: |
          pnpm -C apps/rd-controller install --frozen-lockfile
          pnpm -C apps/rd-controller tauri build
          # 未签名 dmg；README 写明右键打开
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-controller-macos
          path: apps/rd-controller/src-tauri/target/release/bundle/dmg/*.dmg

  publish:
    needs: [agent-windows, controller-windows, controller-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
