name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  agent-windows:
    runs-on: windows-latest
    env:
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg-btbn
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (libclang for ffmpeg-sys-next)
        run: choco install llvm -y
      - name: Download BtbN LGPL-shared FFmpeg 9.0
        shell: pwsh
        # 首跑缺陷修复：原 URL tag n9.0 与文件名均不存在（404）。BtbN 版本化
        # 构建挂在 latest tag 下，文件名带版本后缀。
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Move-Item $dir.FullName "$env:GITHUB_WORKSPACE\ffmpeg-btbn"
      - name: Package agent
        shell: pwsh
        run: powershell -ExecutionPolicy Bypass -File scripts/package-agent.ps1
      - name: Pack agent update bundle（改造项 A：切块 + 清单 + 签名）
        shell: pwsh
        env:
          # ed25519 seed hex（rd-pack-cli keygen 生成；T-039 配 GitHub secret）。
          # 未配置时 pack/update.json 照常产出、跳过签名——Agent 端公钥占位
          # 本来就 fail-closed 不消费，发布流水线不因密钥未就绪而阻塞。
          RD_UPDATE_SIGN_KEY: ${{ secrets.RD_UPDATE_SIGN_KEY }}
        run: |
          $zip = Get-ChildItem dist -Filter "rd-agent-*-win64.zip" | Select-Object -First 1
          if (-not $zip) { Write-Error "dist 下没有 agent zip"; exit 1 }
          # 版本从 zip 文件名取（rd-agent-<版本>-win64.zip），与 package-agent.ps1 同源
          $version = $zip.Name -replace '^rd-agent-', '' -replace '-win64\.zip$', ''
          $keyArgs = @()
          if ($env:RD_UPDATE_SIGN_KEY) {
            $keyFile = "$env:RUNNER_TEMP\rd-sign-key.hex"
            Set-Content -Path $keyFile -Value $env:RD_UPDATE_SIGN_KEY -NoNewline
            $keyArgs = @("--sign-key", "@$keyFile")
          } else {
            Write-Host "RD_UPDATE_SIGN_KEY 未配置：跳过 update.json 签名（T-039 前的占位行为）"
          }
          cargo run -q -p rd-update-pack --features mirror --bin rd-pack-cli -- pack `
            --zip $zip.FullName --version $version --out-dir dist @keyArgs
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-agent-win64
          path: |
            dist/rd-agent-*-win64.zip
            dist/rd-agent-*-win64.pack
            dist/update.json
            dist/update.json.sig

  controller-windows:
    runs-on: windows-latest
    env:
      # 融合版 controller 链接 rd-agent → rd-capture-win → ffmpeg-sys-next：
      # 编译需 FFMPEG_DIR（SDK）+ LIBCLANG_PATH（bindgen），与 agent-windows 同源
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg-btbn
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM (libclang for ffmpeg-sys-next)
        run: choco install llvm -y
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/rd-controller/pnpm-lock.yaml
      - name: Download FFmpeg 9.0 + 填充 ffmpeg-bin（bundle.resources 期望目录，gitignore 不入库）
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Move-Item $dir.FullName "$env:GITHUB_WORKSPACE\ffmpeg-btbn"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\apps\rd-controller\src-tauri\ffmpeg-bin" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\ffmpeg-btbn\bin\*.dll" "$env:GITHUB_WORKSPACE\apps\rd-controller\src-tauri\ffmpeg-bin\"
      - name: Build controller (NSIS installer + updater artifacts)
        shell: pwsh
        env:
          # updater 签名私钥（minisign；T-038 本地生成，值待 T-039 配 GitHub secret。
          # createUpdaterArtifacts 已启用——缺密钥时构建会明确失败，属预期护栏）
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          pnpm -C apps/rd-controller install --frozen-lockfile
          pnpm -C apps/rd-controller tauri build
          # 未签名安装包；NSIS 产物与 updater .sig 在根 target/release/bundle/nsis/
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-controller-windows
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/nsis/*.sig

  publish:
    # 首跑缺陷：controller-macos job 摘除——融合版 controller 链接 rd-agent，
    # 其 capture/window 模块 #[cfg(windows)]，从未能在 macOS 编译（此前零次
    # 真实运行未暴露）。跨平台支持待 rd-agent 解耦改造；下方 latest.json 的
    # darwin-aarch64 分支已容错（无 .app.tar.gz 即不写该平台），恢复 job 时自动接上。
    needs: [agent-windows, controller-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: dist
      - name: Generate updater latest.json（M-3：updater 查询端点）
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart("v")
          $base = "${{ github.server_url }}/${{ github.repository }}/releases/download/$tag"
          $latest = [ordered]@{
            version = $version
            notes = "rd $tag"
            pub_date = (Get-Date).ToUniversalTime().ToString("yyyy-MM-dd'T'HH:mm:ss'Z'")
            platforms = [ordered]@{}
          }
          $setup = Get-ChildItem dist -Filter "rd-controller_*_x64-setup.exe" |
            Select-Object -First 1
          if ($setup) {
            $sig = (Get-Content "$($setup.FullName).sig" -Raw).Trim()
            $latest.platforms["windows-x86_64"] = [ordered]@{
              signature = $sig
              url = "$base/$($setup.Name)"
            }
          }
          $appTar = Get-ChildItem dist -Filter "*.app.tar.gz" |
            Select-Object -First 1
          if ($appTar) {
            $sig = (Get-Content "$($appTar.FullName).sig" -Raw).Trim()
            $latest.platforms["darwin-aarch64"] = [ordered]@{
              signature = $sig
              url = "$base/$($appTar.Name)"
            }
          }
          $latest | ConvertTo-Json -Depth 5 |
            Set-Content dist/latest.json -Encoding utf8
          Write-Host "latest.json: v$version, platforms=$($latest.platforms.Keys -join ',')"
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true

  mirror-cos:
    # 改造项 B：国内渠道补传（COS+CDN）。publish 产物齐全后才跑；内容寻址
    # 幂等（同 sha256 跳过、不同拒绝），可中断重跑；latest 指针防回滚。
    # 未配置 COS 密钥（T-039 前）时步骤自查空变量即跳过，流水线不受阻。
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Mirror to COS（内容寻址幂等补传）
        shell: pwsh
        env:
          COS_CONFIG_JSON: ${{ secrets.COS_CONFIG_JSON }}
          COS_KEYS_JSON: ${{ secrets.COS_KEYS_JSON }}
        run: |
          if (-not $env:COS_CONFIG_JSON -or -not $env:COS_KEYS_JSON) {
            Write-Host "COS_CONFIG_JSON / COS_KEYS_JSON 未配置：跳过国内渠道补传（T-039 前的占位行为）"
            exit 0
          }
          $cfgFile = "$env:RUNNER_TEMP\rd-cos-config.json"
          $keyFile = "$env:RUNNER_TEMP\rd-cos-keys.json"
          Set-Content -Path $cfgFile -Value $env:COS_CONFIG_JSON -NoNewline
          Set-Content -Path $keyFile -Value $env:COS_KEYS_JSON -NoNewline
          # 密钥只经临时文件传 CLI（@引用），不进命令行参数（进程列表可见）
          cargo run -q -p rd-update-pack --features mirror --bin rd-pack-cli -- mirror `
            --tag "${{ github.ref_name }}" `
            --cos "@$cfgFile" --cos-keys "@$keyFile"
