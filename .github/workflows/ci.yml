name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    runs-on: windows-latest
    env:
      # rd-encode 的 ffmpeg feature（Windows 默认开启）需要：
      # - FFMPEG_DIR：BtbN LGPL shared 构建（动态链接，不含 libx264）
      # - LIBCLANG_PATH：ffmpeg-sys-next 的 bindgen 需要 libclang
      FFMPEG_DIR: ${{ github.workspace }}\ffmpeg-btbn
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
      # ffmpeg-sys-next 构建脚本（bindgen 解析 FFmpeg 大头部）会在默认 1MB
      # 主线程栈上溢出。修在仓库 .cargo/config.toml：链接器 /STACK 加大到
      # 16MB（主线程栈由 PE 头决定，RUST_MIN_STACK 管不到，勿再用它）。
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install LLVM (libclang for ffmpeg-sys-next)
        run: choco install llvm -y
      - name: Download BtbN LGPL-shared FFmpeg 9.0
        shell: pwsh
        run: |
          $zip = "$env:RUNNER_TEMP\ffmpeg.zip"
          Invoke-WebRequest -Uri 'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-n9.0-latest-win64-lgpl-shared-9.0.zip' -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\ffmpeg"
          $dir = Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1
          Move-Item $dir.FullName "$env:GITHUB_WORKSPACE\ffmpeg-btbn"
          Add-Content $env:GITHUB_PATH "$env:GITHUB_WORKSPACE\ffmpeg-btbn\bin"
      # tauri.conf.json 的 bundle.resources 声明了 ffmpeg-bin/*（FFmpeg DLL，本地
      # gitignore）与 switchboard/studio/dist（Studio 前端产物，本地构建生成），
      # tauri-build 在编译期校验 glob，缺失即失败。CI 用刚下载的 BtbN DLL 备出
      # 前者、用占位文件备出后者（clippy/test 只需目录存在，不打包）。
      - name: Prepare tauri bundle resource dirs (ffmpeg-bin, studio/dist)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\apps\rd-controller\src-tauri\ffmpeg-bin" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\ffmpeg-btbn\bin\*.dll" "$env:GITHUB_WORKSPACE\apps\rd-controller\src-tauri\ffmpeg-bin\"
          New-Item -ItemType Directory -Force "$env:GITHUB_WORKSPACE\switchboard\studio\dist" | Out-Null
          Set-Content "$env:GITHUB_WORKSPACE\switchboard\studio\dist\.ci-placeholder" "placeholder for tauri bundle.resources glob"
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # --no-fail-fast：e2e 失败后 spike_loopback（合成帧→编码器→流，不依赖
      # WGC）仍会跑，用来隔离「CI 上编码器不产 AU」还是「捕获→编码接线」问题。
      # RD_E2E_SKIP_VIDEO：消费 Agent H264 的用例（t02/t04/t09）在无 GPU VM 上
      # 行为不可靠（MFT 探测能过但真实管线随机卡死，逐轮波动），CI 显式跳过，
      # 视频链路由本地真机回归保证；本地不设此变量，全量执行。
      - run: cargo test --workspace --no-fail-fast
        env:
          RD_E2E_SKIP_VIDEO: "1"
      # T-025 无头端到端（串行运行：用例共享 testwin/Agent 进程）。
      # WGC 不可用时相关用例打印 SKIP 原因后跳过，不静默通过。
      - name: E2E tests (rd-agent, serial)
        run: cargo test -p rd-agent --test e2e -- --test-threads=1
        env:
          RD_E2E_SKIP_VIDEO: "1"

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # 只验证可移植 crate（协议/传输/编码/安全/中继/选路/崩溃/终端/基准）。
      # Windows 专属成员（rd-agent 被控端、rd-controller Tauri 壳、*-win 捕获/
      # 输入/窗口 crate）不参与 macOS 检查：它们是 Windows-only 产品形态，
      # macOS job 的价值是防止共享 crate 误引入平台依赖。
      - run: cargo check -p rd-proto -p rd-transport -p rd-encode -p rd-security -p rd-relay -p rd-switch -p rd-crash -p rd-term -p clarity-bench
