name: Mobile Build (Android & iOS)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional existing release tag to attach artifacts to (e.g. v0.4.7)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  android-apk:
    name: Build Android APK (aarch64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/rd-controller/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: 17

      - name: Configure pre-installed Android SDK & NDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -n 1)
          fi
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;27.0.12077973"
          echo "NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$SDK_ROOT/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install frontend dependencies
        working-directory: apps/rd-controller
        run: pnpm install --frozen-lockfile

      - name: Init Tauri Android project & build release APK
        working-directory: apps/rd-controller
        run: |
          pnpm tauri android init --ci
          pnpm tauri android build --apk --target aarch64

      - name: Collect Android APK
        run: |
          mkdir -p mobile-out
          APK=$(find apps/rd-controller/src-tauri/gen/android/app/build/outputs/apk -name "*.apk" | head -n 1)
          if [ -z "$APK" ]; then
            echo "No APK found"
            exit 1
          fi
          cp "$APK" mobile-out/rd-controller-android-aarch64.apk
          ls -lh mobile-out/

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-controller-android-apk
          path: mobile-out/rd-controller-android-aarch64.apk

      - name: Attach Android APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          echo "Waiting for GitHub Release $TAG to be created..."
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" mobile-out/rd-controller-android-aarch64.apk --clobber
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for release $TAG"
          exit 1

  ios-ipa:
    name: Build Unsigned iOS IPA (aarch64)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/rd-controller/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Install frontend dependencies
        working-directory: apps/rd-controller
        run: pnpm install --frozen-lockfile

      - name: Init Tauri iOS project & build unsigned .app
        working-directory: apps/rd-controller
        run: |
          pnpm build
          pnpm tauri ios init --ci

          # 预编译 Rust iOS 静态库，避免直接调用 xcodebuild 时触发依赖 cli-options-server.json 的 tauri ios xcode-script。
          cargo build --manifest-path src-tauri/Cargo.toml --target aarch64-apple-ios --release --lib
          STATIC_LIB="../../target/aarch64-apple-ios/release/librd_controller_lib.a"
          if [ ! -f "$STATIC_LIB" ]; then
            echo "Built static library not found at $STATIC_LIB"
            ls -la ../../target/aarch64-apple-ios/release/ || true
            exit 1
          fi

          APPLE_DIR="src-tauri/gen/apple"
          mkdir -p "$APPLE_DIR/Externals/arm64/release"
          cp "$STATIC_LIB" "$APPLE_DIR/Externals/arm64/release/libapp.a"
          cp "$STATIC_LIB" "$APPLE_DIR/Externals/arm64/release/librd_controller_lib.a"
          ls -lh "$APPLE_DIR/Externals/arm64/release/"

          PROJ=$(find "$APPLE_DIR" -maxdepth 1 -name "*.xcodeproj" | head -n 1)
          echo "Using Xcode project: $PROJ"
          # 将 Xcode 内的 `Build Rust Code` 脚本阶段替换为 no-op（Rust 静态库与前端 dist 已预构建）。
          python3 - "$PROJ/project.pbxproj" <<'PY'
          import re, sys
          path = sys.argv[1]
          txt = open(path, "r", encoding="utf-8").read()
          new_txt, n = re.subn(
              r'(shellScript\s*=\s*")[^"]*xcode-script[^"]*(";)',
              r'\1echo Using prebuilt Rust staticlib\\n\2',
              txt,
          )
          print(f"Patched {n} xcode-script phase(s) in {path}")
          assert n >= 1, "Failed to locate tauri ios xcode-script phase in project.pbxproj"
          open(path, "w", encoding="utf-8").write(new_txt)
          PY

          SCHEME=$(xcodebuild -list -project "$PROJ" | awk '/Schemes:/{flag=1;next} flag && NF{print $1; exit}')
          echo "Using Xcode scheme: $SCHEME"
          xcodebuild \
            -project "$PROJ" \
            -scheme "$SCHEME" \
            -configuration release \
            -sdk iphoneos \
            -arch arm64 \
            -derivedDataPath "$APPLE_DIR/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            build

      - name: Package unsigned .ipa (for AltStore / Sideloadly / TrollStore)
        run: |
          mkdir -p mobile-out/Payload
          APP_PATH=$(find apps/rd-controller/src-tauri/gen/apple/build/DerivedData/Build/Products/release-iphoneos apps/rd-controller/src-tauri/gen/apple/build/DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Listing build products:"
            find apps/rd-controller/src-tauri/gen/apple/build/DerivedData/Build/Products -maxdepth 3 || true
            exit 1
          fi
          cp -R "$APP_PATH" mobile-out/Payload/
          (cd mobile-out && zip -qr rd-controller-ios-unsigned.ipa Payload)
          rm -rf mobile-out/Payload
          ls -lh mobile-out/rd-controller-ios-unsigned.ipa

      - name: Upload Unsigned iOS IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: rd-controller-ios-unsigned-ipa
          path: mobile-out/rd-controller-ios-unsigned.ipa

      - name: Attach Unsigned iOS IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG="${INPUT_TAG:-${GITHUB_REF#refs/tags/}}"
          echo "Waiting for GitHub Release $TAG to be created..."
          for i in $(seq 1 60); do
            if gh release view "$TAG" >/dev/null 2>&1; then
              gh release upload "$TAG" mobile-out/rd-controller-ios-unsigned.ipa --clobber
              exit 0
            fi
            sleep 15
          done
          echo "Timed out waiting for release $TAG"
          exit 1
