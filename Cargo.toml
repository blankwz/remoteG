[workspace]
resolver = "2"
members = ["crates/*", "apps/rd-agent", "tools/clarity-bench", "apps/rd-controller/src-tauri"]

[workspace.package]
version = "0.4.6"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
prost = "0.14"
prost-build = "0.14"
qoi = "0.4"
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windows = "0.62"
zstd = "0.14"

[profile.release]
lto = "thin"

# 快速真机拷贝测试档位：开启增量编译、关闭耗时 LTO 与符号体积膨胀，秒出可独立运行 exe
[profile.fast-dist]
inherits = "dev"
opt-level = 2
debug = false
incremental = true

# 关键性能保障：即使在 `cargo run` / `tauri build --debug --no-bundle` (fast-exe) 下，
# 也对纯 CPU 视频色彩转换、软编、块哈希与无损瓦片压缩强制开启 -O3 / -O2 SIMD 优化，
# 将 1080p/4K 单帧处理从 ~180ms 降至 <3ms，彻底消除调试/快编包画面卡顿与 700ms 积压延迟！
[profile.dev.package.rd-encode]
opt-level = 3
[profile.dev.package.rd-capture-win]
opt-level = 2
[profile.dev.package.dcv-color-primitives]
opt-level = 3
[profile.dev.package.openh264]
opt-level = 3
[profile.dev.package.qoi]
opt-level = 3
[profile.dev.package.xxhash-rust]
opt-level = 3
[profile.dev.package.zstd]
opt-level = 3
[profile.dev.package.zstd-safe]
opt-level = 3
