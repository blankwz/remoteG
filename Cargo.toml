[workspace]
resolver = "2"
members = ["crates/*", "apps/rd-agent", "tools/clarity-bench", "apps/rd-controller/src-tauri"]

[workspace.package]
version = "0.4.2"
edition = "2021"

[workspace.dependencies]
anyhow = "1"
bytes = "1"
prost = "0.14"
prost-build = "0.14"
qoi = "0.4"
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
windows = "0.62"
zstd = "0.14"

[profile.release]
lto = "thin"
