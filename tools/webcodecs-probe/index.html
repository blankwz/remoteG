function b64ToU8(b64) {
  const bin = atob(b64);
  const u8 = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
  return u8;
}

// Annex-B 按起始码切 NAL，再按 slice NAL(1/5) 边界切 AU；start code 长度计入 chunk
function splitAUs(u8) {
  const starts = [];
  for (let i = 0; i + 3 < u8.length; i++) {
    if (u8[i] === 0 && u8[i+1] === 0 && u8[i+2] === 1) starts.push({ off: i, len: 3, nal: i + 3 });
    else if (i + 4 <= u8.length && u8[i] === 0 && u8[i+1] === 0 && u8[i+2] === 0 && u8[i+3] === 1) { starts.push({ off: i, len: 4, nal: i + 4 }); i += 1; }
  }
  starts.sort((a, b) => a.off - b.off);
  const aus = [];
  let cur = null;
  for (let s = 0; s < starts.length; s++) {
    const st = starts[s];
    const nextOff = s + 1 < starts.length ? starts[s + 1].off : u8.length;
    const nalType = u8[st.nal] & 0x1f;
    const isSlice = nalType === 1 || nalType === 5;
    if (isSlice && cur) {
      cur.end = st.off;
      aus.push(cur);
      cur = null;
    }
    if (!cur) cur = { start: st.off, end: u8.length, key: nalType === 5 };
    void nextOff;
  }
  if (cur && cur.start < u8.length) aus.push(cur);
  return aus.map(a => ({ data: u8.subarray(a.start, a.end), key: a.key }));
}

async function probeCaps() {
  const tb = document.querySelector("#caps tbody");
  const rows = [];
  if (!("VideoDecoder" in window)) {
    const tr = tb.insertRow(); tr.innerHTML = "<td colspan=3 class=no>VideoDecoder 不可用</td>";
    rows.push({ codec: null, supported: false, error: "no VideoDecoder" });
    return rows;
  }
  for (const [codec, desc] of CODECS) {
    let supported = false, detail = "";
    try { supported = (await VideoDecoder.isConfigSupported({ codec })).supported; }
    catch (e) { detail = String(e); }
    const tr = tb.insertRow();
    tr.innerHTML = `<td>${codec}</td><td>${desc}</td><td class="${supported ? "ok" : "no"}">${supported}${detail ? " (" + detail + ")" : ""}</td>`;
    rows.push({ codec, supported, detail });
  }
  return rows;
}

async function decodeTest() {
  const st = document.getElementById("status");
  const out = document.getElementById("result");
  if (!("VideoDecoder" in window)) { out.textContent = "VideoDecoder 不可用"; return null; }
  st.textContent = "解码中…";
  const u8 = b64ToU8(H264_B64);
  const aus = splitAUs(u8);
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const lat = [];
  const t0 = performance.now();
  let firstOk = null, n = 0;
  await new Promise((resolve) => {
    const dec = new VideoDecoder({
      output: (frame) => {
        if (lat[n] !== undefined) lat[n] = performance.now() - lat[n];
        if (n === 0 && firstOk === null) firstOk = true;
        if (n % 30 === 0) { cv.width = frame.displayWidth; ctx.drawImage(frame, 0, 0); }
        frame.close();
        n++;
        if (n >= aus.length) resolve();
      },
      error: (e) => { out.textContent = "解码错误: " + e; resolve(); },
    });
    dec.configure({ codec: "avc1.42E033", optimizeForLatency: true, hardwareAcceleration: "prefer-hardware" });
    (async () => {
      for (let i = 0; i < aus.length; i++) {
        const au = aus[i];
        lat[i] = performance.now(); // 记 decode 调用时刻，output 回调时回填差值
        dec.decode(new EncodedVideoChunk({
          type: au.key ? "key" : "delta",
          timestamp: i * 16667,
          data: au.data,
        }));
        if (au.key && i > 0) await dec.flush(); // 每个 IDR 后 flush 防积压
      }
      await dec.flush();
    })();
  });
  const wall = performance.now() - t0;
  const valid = lat.filter(x => x !== undefined && isFinite(x)).sort((a, b) => a - b);
  const p = q => valid.length ? +valid[Math.min(valid.length - 1, Math.floor(q * valid.length))].toFixed(2) : null;
  const res = {
    ua: navigator.userAgent,
    frames: n,
    wall_ms: +wall.toFixed(1),
    fps_throughput: +(n / (wall / 1000)).toFixed(1),
    decode_ms_avg: valid.length ? +(valid.reduce((a, b) => a + b, 0) / valid.length).toFixed(2) : null,
    decode_ms_p50: p(0.5), decode_ms_p95: p(0.95), decode_ms_max: p(1),
  };
  st.textContent = "完成";
  out.textContent = JSON.stringify(res, null, 2);
  document.getElementById("copy").style.display = "";
  window.__probeResult = res;
  return res;
}

document.getElementById("run").addEventListener("click", () => decodeTest().catch(e => { document.getElementById("result").textContent = String(e); }));
document.getElementById("copy").addEventListener("click", async () => {
  const data = { caps: window.__caps, decode: window.__probeResult };
  try { await navigator.clipboard.writeText(JSON.stringify(data, null, 2)); document.getElementById("copy").textContent = "已复制"; }
  catch { window.__jsonFallback = JSON.stringify(data, null, 2); document.getElementById("copy").textContent = "剪贴板不可用，见控制台"; console.log(window.__jsonFallback); }
});

(async () => {
  document.getElementById("ua").textContent = navigator.userAgent;
  window.__caps = await probeCaps();
})();
</script>
