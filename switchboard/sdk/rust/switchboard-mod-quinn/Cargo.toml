[package]
name = "switchboard-mod-quinn"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "sb.quinn.quic：真实 QUIC 传输适配器（datagram + 流、证书指纹钉扎、统一遥测）"

[dependencies]
switchboard-core = { path = "../switchboard-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"
quinn = "0.11"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.13"
sha2 = "0.10"

[dev-dependencies]
switchboard-mod-fec-rs = { path = "../switchboard-mod-fec-rs" }
