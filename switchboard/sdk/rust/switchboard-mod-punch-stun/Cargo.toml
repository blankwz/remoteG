[package]
name = "switchboard-mod-punch-stun"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "sb.stun.punch-v2：UDP 打洞适配器——实现 spec 01 §4.1 五条铁律的参考实现"

[dependencies]
switchboard-core = { path = "../switchboard-core" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"
