[package]
name = "switchboard-bench"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "SB-Bench：Switchboard 基准与评分（spec/04）命令行实现"

[dependencies]
switchboard-core = { path = "../switchboard-core" }
switchboard-mod-fec-rs = { path = "../switchboard-mod-fec-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
