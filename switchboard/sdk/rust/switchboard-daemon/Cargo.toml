[package]
name = "switchboard-daemon"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Switchboard 本地守护进程：合成会话引擎 + WebSocket 遥测流 + HTTP 控制 API（Studio 运行态可视化后端）"

[dependencies]
switchboard-core = { path = "../switchboard-core" }
switchboard-mod-fec-rs = { path = "../switchboard-mod-fec-rs" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
